name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup just
        uses: extractions/setup-just@v3

      # Tests use fixture jsonl + real CSA bin (no mocks) to verify the contract
      # against the actual claude-session-analysis output. The bin is a single
      # bun/node polyglot script; we install it by cloning the repo and adding
      # its bin/ directory to PATH.
      - name: Install claude-session-analysis
        run: |
          git clone --depth 1 https://github.com/kawaz/claude-session-analysis.git "$HOME/csa"
          chmod +x "$HOME/csa/skills/claude-session-analysis/bin/claude-session-analysis"
          echo "$HOME/csa/skills/claude-session-analysis/bin" >> "$GITHUB_PATH"

      - name: Verify CSA bin
        run: claude-session-analysis --help | head -5

      - name: Run check (test + typecheck + lint + fmt-check)
        run: just check

      - name: Build
        run: just build

      - name: Verify build artifact
        run: test -x dist/idea-storage
