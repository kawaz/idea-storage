name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Cache Bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      # Tests use fixture jsonl + real CSA bin (no mocks) to verify the contract
      # against the actual claude-session-analysis output. The bin is a single
      # bun/node polyglot script; we install it by cloning the repo and adding
      # its bin/ directory to PATH.
      #
      # CSA has no release tags — pin to a specific main HEAD SHA for supply-chain
      # safety (otherwise CI implicitly trusts whatever main HEAD points at).
      - name: Install claude-session-analysis
        env:
          CSA_REPO: https://github.com/kawaz/claude-session-analysis.git
          CSA_SHA: 7d29ea0b2e6fd7a2a6983fa8dc3c1e71ceaa1466 # 2026-06-02 main
        run: |
          git clone --depth 1 "$CSA_REPO" "$HOME/csa"
          cd "$HOME/csa"
          git fetch --depth 1 origin "$CSA_SHA"
          git checkout "$CSA_SHA"
          chmod +x "$HOME/csa/skills/claude-session-analysis/bin/claude-session-analysis"
          echo "$HOME/csa/skills/claude-session-analysis/bin" >> "$GITHUB_PATH"

      - name: Verify CSA bin
        run: claude-session-analysis --help | head -5

      - name: Run check (test + typecheck + lint + fmt-check)
        run: just check

      - name: Verify shell wrapper is executable
        run: test -x bin/idea-storage
